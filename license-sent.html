<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zgłoszenie wysłane — Project S:</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1220;
    --surface:#131b2e;
    --border:#26314a;
    --text:#e7ecf5;
    --muted:#8d97ad;
    --accent:#5b8cf2;
    --success:#4fbf87;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    line-height:1.55;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .panel{
    max-width:480px;
    width:100%;
    margin:24px;
    padding:44px 36px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    text-align:center;
  }
  .mark{
    width:52px;height:52px;border-radius:50%;
    background:rgba(79,191,135,0.12);
    border:1px solid var(--success);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 22px;
    font-size:1.5rem;color:var(--success);
  }
  h1{
    font-size:1.5rem;font-weight:700;margin:0 0 14px;letter-spacing:-0.01em;
  }
  p{
    color:var(--muted);font-size:1rem;margin:0 0 30px;
  }
  a.ok-button{
    display:inline-block;
    appearance:none;border:none;border-radius:6px;
    background:var(--accent);color:#0c1220;
    font-family:inherit;font-weight:600;font-size:1rem;
    padding:12px 32px;cursor:pointer;text-decoration:none;
    transition:background .15s ease;
  }
  a.ok-button:hover{background:#7aa3f5;}
</style>
</head>
<body>

<div class="panel">
  <div class="mark">✓</div>
  <h1>Zgłoszenie zostało wysłane</h1>
  <p>Przesłanie kodu licencyjnego może zająć kilka dni.</p>
  <a class="ok-button" href="index.html">OK</a>
</div>

</body>
</html>
